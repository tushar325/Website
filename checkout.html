<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout · Bean & Bloom</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .checkout-grid { display:grid; grid-template-columns:1.4fr .9fr; gap:1.5rem; align-items:start; }
    @media (max-width:900px) { .checkout-grid { grid-template-columns:1fr; } }
    .checkout-card { background:rgba(255,255,255,.92); border:1px solid rgba(223,229,236,.85); border-radius:22px; padding:1.5rem; margin-bottom:1.2rem; box-shadow:0 14px 36px rgba(31,40,65,.05); }
    .checkout-card h3 { margin:0 0 1.1rem; display:flex; align-items:center; gap:.65rem; font-size:1.1rem; }
    .step-badge { width:28px; height:28px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; font-size:.8rem; font-weight:700; flex-shrink:0; }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
    @media (max-width:640px) { .form-row { grid-template-columns:1fr; } }
    .payment-option { display:flex; align-items:flex-start; gap:1rem; padding:1rem 1.1rem; border:2px solid var(--border); border-radius:14px; background:#fff; margin-bottom:.75rem; cursor:pointer; transition:border-color .18s ease, background .18s ease, box-shadow .18s ease; }
    .payment-option:has(input:checked),
    .payment-option.is-selected { border-color:var(--accent); background:var(--accent-soft,rgba(47,93,74,.08)); box-shadow:0 0 0 3px rgba(47,93,74,.1); }
    .payment-option input { margin-top:.35rem; accent-color:var(--accent); }
    .payment-option .pay-icon { width:40px; height:40px; border-radius:10px; display:grid; place-items:center; font-size:1.25rem; flex-shrink:0; background:rgba(0,0,0,.04); }
    .payment-option .pay-label strong { display:block; font-size:.95rem; }
    .payment-option .pay-label span { font-size:.82rem; color:var(--muted); }
    .order-item-row { display:flex; align-items:center; gap:.85rem; padding:.7rem 0; border-bottom:1px solid rgba(0,0,0,.06); }
    .order-item-row img { width:52px; height:52px; object-fit:cover; border-radius:10px; }
    .order-item-row .item-info { flex:1; min-width:0; }
    .order-item-row .item-info strong { display:block; font-size:.9rem; }
    .order-item-row .item-info span { font-size:.8rem; color:var(--muted); }
    .order-summary-line, .summary-total-line { display:flex; justify-content:space-between; gap:1rem; padding:.35rem 0; font-size:.92rem; }
    .summary-total-line { border-top:1px solid rgba(0,0,0,.08); margin-top:.5rem; padding-top:.8rem; font-weight:700; font-size:1.05rem; }
    .btn-place { width:100%; margin-top:1rem; }
    .pay-error { display:none; color:#b91c1c; font-size:.88rem; margin:.8rem 0 0; }
    .gateway-note { font-size:.82rem; color:var(--muted); margin:.8rem 0 0; text-align:center; }
    #order-success { display:none; text-align:center; padding:2.5rem 1.5rem; }
    .success-icon { font-size:2.5rem; margin-bottom:.5rem; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html" id="site-brand">Bean & Bloom</a>
      <nav class="nav-links" id="site-nav">
        <a href="index.html">Home</a>
        <a href="cart.html">← Back to cart</a>
        <a href="cart.html" class="cart-link"><span class="cart-icon" aria-hidden="true"></span>Cart<span class="cart-count" id="cart-count">0</span></a>
        <span id="user-nav"></span>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="section-head">
        <h1>Checkout</h1>
        <p class="muted">Enter delivery details and pay with Razorpay or Cash on Delivery.</p>
      </div>

      <div id="order-success" class="card">
        <div class="success-icon">✅</div>
        <h2>Order placed successfully!</h2>
        <p id="success-order-id"></p>
        <div style="display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;">
          <a href="orders.html" class="btn">View my orders</a>
          <a href="index.html" class="btn secondary">Continue shopping</a>
        </div>
      </div>

      <form id="checkout-form">
        <div class="checkout-grid">
          <div>
            <div class="checkout-card">
              <h3><span class="step-badge">1</span>Delivery address</h3>
              <div class="form-row">
                <div class="field"><label>Full name *</label><input id="addr-name" type="text" placeholder="Your full name" required></div>
                <div class="field"><label>Mobile number *</label><input id="addr-mobile" type="tel" placeholder="10-digit mobile" pattern="[0-9]{10}" required></div>
              </div>
              <div class="field"><label>Address line 1 *</label><input id="addr-line1" type="text" placeholder="House no., building, street" required></div>
              <div class="field"><label>Address line 2</label><input id="addr-line2" type="text" placeholder="Area, colony (optional)"></div>
              <div class="form-row">
                <div class="field"><label>City *</label><input id="addr-city" type="text" placeholder="City" required></div>
                <div class="field"><label>State *</label><input id="addr-state" type="text" placeholder="State" required></div>
              </div>
              <div class="form-row">
                <div class="field"><label>Pincode *</label><input id="addr-pin" type="text" placeholder="6-digit pincode" pattern="[0-9]{6}" required></div>
                <div class="field"><label>Landmark</label><input id="addr-landmark" type="text" placeholder="Near (optional)"></div>
              </div>
              <label style="display:flex;align-items:center;gap:.6rem;font-size:.88rem;color:var(--muted);cursor:pointer;margin-top:.3rem;">
                <input type="checkbox" id="save-address" checked style="accent-color:var(--accent);"> Save this address for future orders
              </label>
            </div>

            <div class="checkout-card">
              <h3><span class="step-badge">2</span>Payment</h3>
              <div id="payment-options"></div>
              <p class="pay-error" id="pay-error"></p>
            </div>
          </div>

          <div>
            <div class="checkout-card" style="position:sticky;top:5.5rem;">
              <h3><span class="step-badge">3</span>Order summary</h3>
              <div id="checkout-items"></div>
              <div id="checkout-totals"></div>
              <button class="btn btn-place" type="submit" id="place-order-btn">Place order</button>
              <p class="gateway-note" id="gateway-note">Choose a payment method to continue.</p>
            </div>
          </div>
        </div>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container"><p id="footer-text"></p></div>
  </footer>

  <script src="app.js"></script>
  <script src="api-client.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = getLoggedInUser();
      if (!user) { window.location.href = 'login.html'; return; }

      initMobileNav();
      updateCartCount();
      renderUserNav();
      renderPublicSiteContent();

      const cart = loadCart();
      if (!cart.length) { window.location.href = 'cart.html'; return; }

      const saved = loadSavedAddress();
      if (saved) {
        ['name','mobile','line1','line2','city','state','pin','landmark'].forEach((k) => {
          const el = document.getElementById(`addr-${k}`);
          if (el && saved[k]) el.value = saved[k];
        });
      }

      const settings = loadSettings();
      const pay = getPaymentSettings();
      const payContainer = document.getElementById('payment-options');
      const methods = getEnabledPaymentMethods(pay);
      const pricing = calculateCartPricing(cart);
      const placeBtn = document.getElementById('place-order-btn');
      const gatewayNote = document.getElementById('gateway-note');

      const razorpayReady = pay.razorpayEnabled !== false && !!pay.razorpayKeyId;
      const usableMethods = methods.filter((m) => m.id !== 'razorpay' || razorpayReady);

      if (!usableMethods.length) {
        payContainer.innerHTML = '<p class="muted">No payment methods are enabled. Ask the store admin to turn on Razorpay and/or Cash on Delivery in Settings.</p>';
        placeBtn.disabled = true;
      } else {
        payContainer.innerHTML = usableMethods.map((m, index) => `
          <label class="payment-option${index === 0 ? ' is-selected' : ''}">
            <input type="radio" name="pay-method" value="${escapeHtml(m.id)}" ${index === 0 ? 'checked' : ''}>
            <div class="pay-icon">${m.icon}</div>
            <div class="pay-label"><strong>${escapeHtml(m.label)}</strong><span>${escapeHtml(m.sub)}</span></div>
          </label>`).join('');
        if (methods.some((m) => m.id === 'razorpay') && !razorpayReady) {
          payContainer.insertAdjacentHTML('beforeend', '<p class="muted" style="margin:.35rem 0 0;font-size:.82rem;">Razorpay is enabled but needs a Key ID in Admin → Settings.</p>');
        }
        syncCheckoutPaymentUi();
        payContainer.addEventListener('change', syncCheckoutPaymentUi);
      }

      function selectedPayMethod() {
        return document.querySelector('input[name="pay-method"]:checked')?.value || usableMethods[0]?.id || '';
      }

      function syncCheckoutPaymentUi() {
        const method = selectedPayMethod();
        payContainer.querySelectorAll('.payment-option').forEach((el) => {
          el.classList.toggle('is-selected', el.querySelector('input')?.checked);
        });
        if (method === 'cod') {
          placeBtn.textContent = 'Place COD order';
          gatewayNote.textContent = 'Pay in cash when your order is delivered.';
        } else {
          placeBtn.textContent = 'Pay with Razorpay';
          gatewayNote.textContent = 'You will complete payment in Razorpay Checkout (cards, UPI, net banking, wallets).';
        }
      }

      const itemsEl = document.getElementById('checkout-items');
      cart.forEach((item) => {
        const row = document.createElement('div');
        row.className = 'order-item-row';
        const variantBit = item.variantLabel ? ` · ${item.variantLabel}` : '';
        row.innerHTML = `
          <img src="${escapeHtml(item.imageUrl || DEFAULT_IMAGE_URL)}" alt="${escapeHtml(item.name)}">
          <div class="item-info"><strong>${escapeHtml(item.name)}</strong><span>Qty: ${item.quantity}${escapeHtml(variantBit)} · ${escapeHtml(item.category || '')}</span></div>
          <div class="item-price">${formatCurrencyAmount(item.price * item.quantity)}</div>`;
        itemsEl.appendChild(row);
      });

      const discountLines = pricing.applied.map((row) => `
        <div class="order-summary-line"><span>${escapeHtml(row.name)}</span><span style="color:#16a34a;">−${formatCurrencyAmount(row.amount)}</span></div>
      `).join('');
      document.getElementById('checkout-totals').innerHTML = `
        <div class="order-summary-line"><span>Subtotal</span><span>${formatCurrencyAmount(pricing.subtotal)}</span></div>
        ${discountLines || '<div class="order-summary-line"><span>Discounts</span><span>₹0.00</span></div>'}
        <div class="summary-total-line"><span>Total</span><span>${formatCurrencyAmount(pricing.total)}</span></div>`;

      document.getElementById('checkout-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        clearPayError();
        const method = selectedPayMethod();
        if (!method) {
          showPayError('Choose a payment method.');
          return;
        }
        const address = {
          name: document.getElementById('addr-name').value.trim(),
          mobile: document.getElementById('addr-mobile').value.trim(),
          line1: document.getElementById('addr-line1').value.trim(),
          line2: document.getElementById('addr-line2').value.trim(),
          city: document.getElementById('addr-city').value.trim(),
          state: document.getElementById('addr-state').value.trim(),
          pin: document.getElementById('addr-pin').value.trim(),
          landmark: document.getElementById('addr-landmark').value.trim()
        };
        if (document.getElementById('save-address').checked) saveAddress(address);

        if (method === 'cod') {
          placeOrder(address, cart, pricing, 'cod', {});
          return;
        }

        if (!pay.razorpayEnabled || !pay.razorpayKeyId) {
          showPayError('Razorpay Key ID is missing in admin settings.');
          return;
        }
        await handleRazorpay(address, cart, pricing, pay.razorpayKeyId, settings.siteName);
      });
    });

    function showPayError(message) {
      const el = document.getElementById('pay-error');
      el.style.display = 'block';
      el.textContent = message;
    }

    function clearPayError() {
      const el = document.getElementById('pay-error');
      el.style.display = 'none';
      el.textContent = '';
    }

    async function persistOrderToApi(order) {
      try {
        if (window.BeanbBloomAPI?.Orders?.create) {
          await window.BeanbBloomAPI.Orders.create(order);
        }
      } catch (err) {
        console.warn('MySQL order sync skipped:', err.message || err);
      }
    }

    function placeOrder(address, cart, pricing, payMethod = 'razorpay', paymentMeta = {}) {
      const orderId = 'ORD-' + Date.now();
      const isCod = payMethod === 'cod';
      const order = {
        id: orderId,
        date: new Date().toISOString(),
        address,
        payMethod,
        paymentMeta,
        paymentVerified: false,
        items: cart.map((i) => ({
          id: i.id,
          name: i.name,
          price: i.price,
          quantity: i.quantity,
          category: i.category,
          variantId: i.variantId || '',
          variantLabel: i.variantLabel || ''
        })),
        subtotal: pricing.subtotal,
        discountTotal: pricing.discountTotal,
        discountsApplied: pricing.applied,
        total: pricing.total,
        status: isCod ? 'Confirmed' : 'Paid'
      };
      saveOrder(order);
      persistOrderToApi(order);
      clearCart();

      document.getElementById('checkout-form').style.display = 'none';
      const suc = document.getElementById('order-success');
      suc.style.display = 'block';
      document.getElementById('success-order-id').textContent = isCod
        ? `Order ID: ${orderId} · Cash on Delivery · ${address.name} · ${address.city}`
        : `Order ID: ${orderId} · Razorpay · Payment ID: ${paymentMeta.razorpayPaymentId || 'pending'} · ${address.name} · ${address.city}`;
      if (typeof showToast === 'function') {
        showToast(isCod
          ? 'COD order placed. Pay when your order is delivered.'
          : 'Order placed. Admin will verify the Razorpay payment.', 'success');
      }
    }

    async function handleRazorpay(address, cart, pricing, keyId, storeName) {
      if (typeof Razorpay === 'undefined') {
        showPayError('Razorpay could not load. Refresh and try again.');
        return;
      }
      const amountPaise = Math.round(Number(pricing.total) * 100);
      if (amountPaise < 100) {
        showPayError('Order total is too low for Razorpay (minimum ₹1.00).');
        return;
      }
      const options = {
        key: keyId,
        amount: amountPaise,
        currency: 'INR',
        name: storeName || 'Bean & Bloom',
        description: `Order for ${address.name}`,
        prefill: { name: address.name, contact: address.mobile },
        theme: { color: '#2f5d4a' },
        handler: function (response) {
          placeOrder(address, cart, pricing, 'razorpay', {
            razorpayPaymentId: response.razorpay_payment_id || '',
            razorpayOrderId: response.razorpay_order_id || '',
            razorpaySignature: response.razorpay_signature || ''
          });
        }
      };
      const rzp = new Razorpay(options);
      rzp.on('payment.failed', () => showPayError('Payment failed. Please try again.'));
      rzp.open();
    }
  </script>
  <script>
    (function () {
      const s = loadSettings();
      if (s.payments?.razorpayEnabled !== false) {
        const tag = document.createElement('script');
        tag.src = 'https://checkout.razorpay.com/v1/checkout.js';
        document.head.appendChild(tag);
      }
    })();
  </script>
</body>
</html>
