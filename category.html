<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop by Category | Bean & Bloom</title>
  <meta name="description" content="Browse coffee products by category at Bean & Bloom.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html">Bean & Bloom</a>
      <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav-links" id="site-nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="menu.html">Menu</a>
        <a href="contact.html">Visit</a>
        <a href="cart.html" class="cart-link"><span class="cart-icon" aria-hidden="true"></span>Cart<span class="cart-count" id="cart-count">0</span></a>
        <span id="user-nav"></span>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-head">
          <h1 id="category-title">Category</h1>
          <p id="category-description">Browse our handpicked selection for this category.</p>
        </div>
        <div id="public-products" class="grid grid-3 product-grid"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div>
        <a class="brand" href="index.html">Bean & Bloom</a>
        <p>© 2026 Bean & Bloom. Fresh coffee, calm spaces, and warm welcomes.</p>
      </div>
      <div class="footer-links">
        <a href="menu.html">Menu</a>
        <a href="contact.html">Visit</a>
        <a href="index.html#products">Shop</a>
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const categoryParam = new URLSearchParams(window.location.search).get('category')?.trim();
      const title = document.getElementById('category-title');

      if (title && categoryParam) {
        title.textContent = categoryParam;
      }

      const root = document.getElementById('public-products');
      if (root && categoryParam) {
        let products = loadProducts();
        products = products.filter(p => p.category && p.category.toLowerCase() === categoryParam.toLowerCase());

        root.innerHTML = '';
        if (!products.length) {
          root.innerHTML = '<div class="card"><p class="muted">No products in this category yet.</p></div>';
        } else {
          products.forEach(product => {
            const card = document.createElement('article');
            card.className = 'product-card';
            card.dataset.productId = product.id;
            card.innerHTML = `
              <img src="${escapeHtml(optimizeImageUrl(product.imageUrl || DEFAULT_IMAGE_URL, 520, 70))}" alt="${escapeHtml(product.name)}" class="product-image" loading="lazy">
              ${product.featured ? '<span class="badge">Featured</span>' : `<span class="badge">${escapeHtml(product.category)}</span>`}
              <h3>${escapeHtml(product.name)}</h3>
              <p class="muted">${escapeHtml(product.description || '')}</p>
              <div class="product-meta">
                <div class="price">${formatCurrencyAmount(Number(product.price))}</div>
                <div class="product-actions">
                  <button class="btn secondary" type="button" data-add-to-cart="${product.id}">Add to cart</button>
                </div>
              </div>
            `;

            const addButton = card.querySelector('[data-add-to-cart]');
            if (addButton) {
              addButton.addEventListener('click', (e) => {
                e.stopPropagation();
                const added = addToCart(product.id);
                if (added) showToast(`${product.name} added to cart.`, 'success');
              });
            }

            card.addEventListener('click', (e) => {
              if (!e.target.closest('[data-add-to-cart]')) {
                window.location.href = `product.html?id=${encodeURIComponent(product.id)}`;
              }
            });

            root.appendChild(card);
          });
        }
      }
    });
  </script>
</body>
</html>
