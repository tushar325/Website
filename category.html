<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop by Category | Bean & Bloom</title>
  <meta name="description" content="Browse coffee products by category at Bean & Bloom.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html">Bean & Bloom</a>
      <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav-links" id="site-nav">
        <a href="index.html">Home</a>
        <a href="index.html#products">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html" class="cart-link"><span class="cart-icon" aria-hidden="true"></span>Cart<span class="cart-count" id="cart-count">0</span></a>
        <span id="user-nav"></span>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-head">
          <div>
            <h1 id="category-title">Category</h1>
            <p id="category-description">Browse our handpicked selection for this category.</p>
          </div>
          <a class="btn secondary" href="index.html#products">All products</a>
        </div>
        <div class="shop-layout">
          <aside class="shop-filters card">
            <h3 style="margin-top:0;">Filters</h3>
            <div class="field">
              <label for="filter-price-min">Min price (₹)</label>
              <input id="filter-price-min" type="number" min="0" step="1" placeholder="0">
            </div>
            <div class="field">
              <label for="filter-price-max">Max price (₹)</label>
              <input id="filter-price-max" type="number" min="0" step="1" placeholder="500">
            </div>
            <label class="compare-check" style="display:flex;gap:.5rem;align-items:center;margin:0 0 1rem;">
              <input id="filter-in-stock" type="checkbox"> In stock only
            </label>
            <button class="btn secondary" type="button" id="shop-clear-filters" style="width:100%;margin:0;">Clear filters</button>
          </aside>
          <div class="shop-results">
            <div class="shop-controls">
              <label class="search-field">
                <span class="visually-hidden">Search</span>
                <input id="product-search" type="search" placeholder="Search in this category…" autocomplete="off">
              </label>
              <label class="sort-field">
                <span class="visually-hidden">Sort</span>
                <select id="product-sort">
                  <option value="featured">Featured</option>
                  <option value="price-asc">Price: low to high</option>
                  <option value="price-desc">Price: high to low</option>
                  <option value="name">Name A–Z</option>
                </select>
              </label>
            </div>
            <p class="shop-result-meta muted" id="shop-result-meta"></p>
            <div id="public-products" class="grid product-grid product-grid-dense" data-show-all="true"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div>
        <a class="brand" href="index.html">Bean & Bloom</a>
        <p>© 2026 Bean & Bloom. Fresh coffee, calm spaces, and warm welcomes.</p>
      </div>
      <div class="footer-links">
        <a href="index.html#products">Shop</a>
        <a href="about.html">Our story</a>
        <a href="contact.html">Contact</a>
        <a href="orders.html">My orders</a>
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const categoryParam = new URLSearchParams(window.location.search).get('category')?.trim();
      const title = document.getElementById('category-title');
      if (title && categoryParam) title.textContent = categoryParam;
      document.body.dataset.seoTitle = `${categoryParam || 'Shop'} | Bean & Bloom`;
      applySeoMeta();
      // Keep category filter via URL while using shared shop controls
      const original = renderPublicProducts;
      window.renderPublicProducts = function (options = {}) {
        original({ ...options, showAll: true, categoryFilter: categoryParam || '' });
      };
      initShopControls();
      renderPublicProducts({ showAll: true, categoryFilter: categoryParam || '' });
    });
  </script>
</body>
</html>
