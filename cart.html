<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart | Bean & Bloom</title>
  <meta name="description" content="Review your cart items and proceed to checkout.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html">Bean & Bloom</a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="menu.html">Menu</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html" class="cart-link"><span class="cart-icon">🛒</span>Cart<span class="cart-count" id="cart-count">0</span></a>
        <span id="user-nav"></span>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="section-head">
        <h1>Your cart</h1>
        <p>Review the products you’ve added and adjust quantities before checkout.</p>
      </div>
      <div class="cart-header-panel card">
        <div class="cart-header-row">
          <div>
            <strong>Deliver to:</strong> Faridabad - 121002
          </div>
          <button class="btn secondary" type="button">Change</button>
        </div>
        <p class="muted">2,00,000+ orders from Faridabad in the last 30 days</p>
      </div>
      <div class="cart-grid">
        <div id="cart-items" class="cart-list"></div>
        <div id="cart-summary" class="cart-summary-panel"></div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Bean & Bloom. Fresh coffee, calm spaces, and warm welcomes.</p>
    </div>
  </footer>

  <script src="api-client.js"></script>
  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = getLoggedInUser();
      if (!user) {
        // Show sign-in prompt inside the cart page
        const cartItems = document.getElementById('cart-items');
        const cartSummary = document.getElementById('cart-summary');
        if (cartItems) cartItems.innerHTML = `
          <div class="card" style="text-align:center;padding:3rem 2rem;">
            <div style="width:56px;height:56px;border-radius:50%;background:rgba(138,75,47,.12);display:grid;place-items:center;margin:0 auto 1.2rem;">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#8c6138" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </div>
            <h3 style="margin:0 0 .6rem;">Sign in to view your cart</h3>
            <p class="muted" style="margin:0 0 1.6rem;">Your cart is saved and linked to your account.</p>
            <div style="display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;">
              <a href="login.html" class="btn">Sign in</a>
              <a href="register.html" class="btn secondary">Create account</a>
            </div>
          </div>`;
        if (cartSummary) cartSummary.innerHTML = '';
        updateCartCount();
        return;
      }
      renderCart();
      updateCartCount();
    });
  </script>
</body>
</html>
