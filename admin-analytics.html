<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Analytics</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      try {
        if (sessionStorage.getItem('bean-bloom-admin') === 'true') {
          document.documentElement.classList.add('admin-authed-html');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body data-admin-page="analytics">
  <script>
    (function () {
      var authed = false;
      try { authed = sessionStorage.getItem('bean-bloom-admin') === 'true'; } catch (e) {}
      if (authed) document.body.classList.add('admin-authed');
    })();
  </script>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="admin.html">Bean & Bloom Admin</a>
      <nav class="nav-links">
        <a href="index.html">Public site</a>
        <a href="admin.html">Dashboard</a>
        <button id="logout-btn" class="btn secondary" type="button" style="display:none;">Log out</button>
      </nav>
    </div>
  </header>
  <main class="section">
    <div class="container">
      <form id="login-form" class="card form-grid">
        <h3>Admin access</h3>
        <div class="form-input-group">
          <svg class="form-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <input id="username" type="text" placeholder="Username" required autocomplete="username">
        </div>
        <div class="form-input-group">
          <svg class="form-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <input id="password" type="password" placeholder="Password" required autocomplete="current-password">
        </div>
        <button class="btn" type="submit">Enter dashboard</button>
        <p class="muted">Demo login: admin / admin</p>
      </form>

      <div id="admin-panel" class="hide">
        <div class="section-head">
          <h2>Analytics</h2>
          <p class="muted">Revenue, payment mix, and top sellers from live order data.</p>
        </div>
        <div class="admin-shell">
          <aside class="admin-sidebar">
            <nav class="sidebar-nav">
            <a href="admin.html" class="sidebar-item">Dashboard</a>
            <a href="admin-analytics.html" class="sidebar-item active">Analytics</a>
            <a href="admin-product-categories.html" class="sidebar-item">Product categories</a>
            <a href="admin-orders.html" class="sidebar-item">Orders</a>
            <a href="admin-customers.html" class="sidebar-item">Customers</a>
            <a href="admin-inventory.html" class="sidebar-item">Inventory</a>
            <a href="admin-discounts.html" class="sidebar-item">Discounts</a>
            <a href="admin-settings.html" class="sidebar-item">Settings</a>
            </nav>
          </aside>
          <main class="admin-main">

          <div id="admin-analytics-panel"></div>
          </main>
        </div>
      </div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
