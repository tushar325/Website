<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account | Bean & Bloom</title>
  <meta name="description" content="Create a Bean & Bloom account to shop premium coffee, track orders, and enjoy member benefits.">
  <link rel="stylesheet" href="styles.css">
  <style>
    .auth-page { min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 3rem 1rem; }
    .auth-card { width: min(500px, 100%); background: rgba(255,255,255,.98); border: 2.5px solid var(--accent); border-radius: 32px; padding: 2.8rem 2.4rem; box-shadow: 0 40px 100px rgba(43,45,98,.14); }
    .auth-brand { text-align: center; margin-bottom: 2rem; }
    .auth-brand .brand-name { font-size: 1.5rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
    .auth-brand p { color: var(--muted); margin: .4rem 0 0; font-size: .95rem; }
    .auth-card h2 { margin: 0 0 1.6rem; font-size: 1.6rem; letter-spacing: -.02em; }
    .auth-footer { margin-top: 1.4rem; text-align: center; color: var(--muted); font-size: .92rem; }
    .auth-footer a { color: var(--accent); font-weight: 700; }
    .auth-footer a:hover { text-decoration: underline; }
    .form-input-group { position: relative; margin-bottom: 1rem; }
    .form-input-group input { width: 100%; padding: .85rem .9rem .85rem 2.5rem; border: 1.5px solid rgba(0,0,0,.12); border-radius: 12px; font: inherit; font-size: 1rem; background: rgba(249,246,242,.95); transition: border-color .2s, box-shadow .2s; }
    .form-input-group input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(138,75,47,.1); }
    .form-icon { position: absolute; left: .9rem; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--accent); pointer-events: none; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 480px) { .form-row { grid-template-columns: 1fr; } }
    .btn-full { width: 100%; padding: .9rem; font-size: 1rem; font-weight: 800; margin-top: .4rem; }
    .status-msg { padding: .7rem 1rem; border-radius: 10px; font-size: .9rem; font-weight: 600; margin-bottom: 1rem; display: none; }
    .status-msg.success { background: rgba(34,197,94,.1); color: #15803d; border: 1px solid rgba(34,197,94,.3); display: block; }
    .status-msg.error { background: rgba(239,68,68,.1); color: #b91c1c; border: 1px solid rgba(239,68,68,.3); display: block; }
    .terms-row { display: flex; align-items: flex-start; gap: .6rem; margin: .6rem 0 1rem; font-size: .88rem; color: var(--muted); }
    .terms-row input { margin-top: 2px; flex-shrink: 0; accent-color: var(--accent); }
    .terms-row a { color: var(--accent); font-weight: 600; }
    .benefits-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; margin-bottom: 1.8rem; }
    .benefit-item { text-align: center; background: rgba(138,75,47,.06); border-radius: 14px; padding: .7rem .5rem; }
    .benefit-item span { display: block; font-size: 1.1rem; margin-bottom: .2rem; }
    .benefit-item p { margin: 0; font-size: .75rem; color: var(--muted); font-weight: 600; }
    .user-avatar { width: 56px; height: 56px; border-radius: 50%; background: rgba(138,75,47,.12); display: grid; place-items: center; margin: 0 auto 1.2rem; }
    .strength-bar { height: 4px; border-radius: 4px; background: rgba(0,0,0,.1); margin-top: .4rem; overflow: hidden; }
    .strength-fill { height: 100%; border-radius: 4px; width: 0%; transition: width .3s, background .3s; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html">Bean & Bloom</a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="menu.html">Menu</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html" class="cart-link"><span class="cart-icon">🛒</span>Cart<span class="cart-count" id="cart-count">0</span></a>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="user-avatar">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#8c6138" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="19" y1="8" x2="19" y2="14"></line><line x1="22" y1="11" x2="16" y2="11"></line></svg>
        </div>
        <div class="brand-name">Bean & Bloom</div>
        <p>Create your free account</p>
      </div>

      <div class="benefits-bar">
        <div class="benefit-item"><span>☕</span><p>Early access</p></div>
        <div class="benefit-item"><span>🚚</span><p>Free shipping</p></div>
        <div class="benefit-item"><span>⭐</span><p>Rewards</p></div>
      </div>

      <div id="status-msg" class="status-msg"></div>

      <form id="register-form">
        <div class="form-row">
          <div class="form-input-group">
            <svg class="form-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <input id="reg-firstname" type="text" placeholder="First name" required>
          </div>
          <div class="form-input-group">
            <svg class="form-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <input id="reg-lastname" type="text" placeholder="Last name" required>
          </div>
        </div>
        <div class="form-input-group">
          <svg class="form-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          <input id="reg-email" type="email" placeholder="Email address" required>
        </div>
        <div class="form-input-group">
          <svg class="form-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 2.18h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6 6l.91-.91a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.73 17z"></path></svg>
          <input id="reg-phone" type="tel" placeholder="Phone number (optional)">
        </div>
        <div class="form-input-group">
          <svg class="form-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <input id="reg-password" type="password" placeholder="Create password" required minlength="6">
          <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
        </div>
        <div class="form-input-group">
          <svg class="form-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <input id="reg-confirm" type="password" placeholder="Confirm password" required>
        </div>
        <div class="terms-row">
          <input type="checkbox" id="agree-terms" required>
          <label for="agree-terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
        </div>
        <button class="btn btn-full" type="submit">Create account</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Bean & Bloom. Fresh coffee, calm spaces, and warm welcomes.</p>
    </div>
  </footer>

  <script src="app.js"></script>
  <script>
    const CUSTOMER_KEY = 'bean-bloom-customers-v1';
    const SESSION_KEY = 'bean-bloom-user-session';

    function loadCustomers() {
      try { return JSON.parse(localStorage.getItem(CUSTOMER_KEY) || '[]'); } catch { return []; }
    }

    function saveCustomers(customers) {
      localStorage.setItem(CUSTOMER_KEY, JSON.stringify(customers));
    }

    function showStatus(msg, type) {
      const el = document.getElementById('status-msg');
      el.textContent = msg;
      el.className = `status-msg ${type}`;
    }

    // Redirect if already logged in
    const existingSession = sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY);
    if (existingSession) {
      window.location.href = 'index.html';
    }

    // Password strength indicator
    document.getElementById('reg-password').addEventListener('input', (e) => {
      const val = e.target.value;
      const fill = document.getElementById('strength-fill');
      let strength = 0;
      if (val.length >= 6) strength++;
      if (val.length >= 10) strength++;
      if (/[A-Z]/.test(val)) strength++;
      if (/[0-9]/.test(val)) strength++;
      if (/[^A-Za-z0-9]/.test(val)) strength++;

      const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#16a34a'];
      fill.style.width = `${(strength / 5) * 100}%`;
      fill.style.background = colors[strength - 1] || 'transparent';
    });

    document.getElementById('register-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const firstName = document.getElementById('reg-firstname').value.trim();
      const lastName = document.getElementById('reg-lastname').value.trim();
      const email = document.getElementById('reg-email').value.trim().toLowerCase();
      const phone = document.getElementById('reg-phone').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirm = document.getElementById('reg-confirm').value;

      if (password !== confirm) {
        showStatus('Passwords do not match.', 'error');
        return;
      }

      if (password.length < 6) {
        showStatus('Password must be at least 6 characters.', 'error');
        return;
      }

      const customers = loadCustomers();
      if (customers.find(c => c.email === email)) {
        showStatus('An account with this email already exists.', 'error');
        return;
      }

      const newCustomer = {
        id: crypto.randomUUID(),
        name: `${firstName} ${lastName}`,
        firstName,
        lastName,
        email,
        phone,
        password,
        joinedAt: new Date().toISOString()
      };

      customers.push(newCustomer);
      saveCustomers(customers);

      // Auto sign-in after registration
      const session = JSON.stringify({ id: newCustomer.id, name: newCustomer.name, email: newCustomer.email });
      sessionStorage.setItem(SESSION_KEY, session);

      showStatus(`Welcome, ${firstName}! Your account has been created.`, 'success');
      setTimeout(() => { window.location.href = 'index.html'; }, 1000);
    });

    document.addEventListener('DOMContentLoaded', () => updateCartCount());
  </script>
</body>
</html>
